# "Temporary" pin from an old incident. Nobody removed it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop-v1-pin
  namespace: lab-apps
  labels:
    team: storefront
    ticket: INC-4711
  annotations:
    lab.io/note: "pin shop to v1 during INC-4711 - remove after RCA"
spec:
  parentRefs:
    - name: edge
      namespace: lab-gateway
  hostnames:
    - ${SHOP_HOST}
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: podinfo-v1, port: 80 }
