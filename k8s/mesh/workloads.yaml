# Identical client + server, applied into sidecar-lab, ambient-lab and legacy-lab:
#   kubectl apply -n <ns> -f k8s/mesh/workloads.yaml
# Each workload has its OWN ServiceAccount, because the SA is the mTLS identity:
#   spiffe://cluster.local/ns/<ns>/sa/<sa>
apiVersion: v1
kind: ServiceAccount
metadata:
  name: httpbin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  labels: { app: httpbin, role: server }
spec:
  replicas: 1
  selector:
    matchLabels: { app: httpbin }
  template:
    metadata:
      labels: { app: httpbin, role: server }
    spec:
      serviceAccountName: httpbin
      containers:
        - name: httpbin
          image: ${HTTPBIN_IMAGE}
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /status/200, port: 8080 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  labels: { app: httpbin }
spec:
  selector: { app: httpbin }
  ports:
    - { name: http, port: 8000, targetPort: 8080 }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: curl
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl
  labels: { app: curl, role: client }
spec:
  replicas: 1
  selector:
    matchLabels: { app: curl }
  template:
    metadata:
      labels: { app: curl, role: client }
    spec:
      serviceAccountName: curl
      terminationGracePeriodSeconds: 0
      containers:
        - name: curl
          image: ${CURL_IMAGE}
          command: ["/bin/sleep", "infinity"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
